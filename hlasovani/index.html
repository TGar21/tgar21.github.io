<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plánovač Termínů</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .state-0 { background-color: #e5e7eb; } /* Šedá - nevyplněno */
        .state-1 { background-color: #22c55e; } /* Zelená - ano */
        .state-2 { background-color: #eab308; } /* Žlutá - možná */
        .state-3 { background-color: #ef4444; } /* Červená - ne */
        .cell-btn { width: 36px; height: 36px; border-radius: 6px; transition: all 0.2s; border: 1px solid #ddd; }
        .table-container { max-width: 100%; overflow-x: auto; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

<div id="app" class="max-w-5xl mx-auto p-4 md:p-8">
    <div id="loading" class="text-center py-20 text-slate-400">Načítání...</div>
    <div id="mainContent" class="hidden"></div>
</div>

<script>
    // --- KONFIGURACE (ZDE DOPLŇTE SVÉ ÚDAJE ZE SUPABASE) ---
    const SUPABASE_URL = 'https://thnwvenbyvzcaycxgmuy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GSopCT6SI0_dyVa1oYTu4A_kWXijypB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let pollId = new URLSearchParams(window.location.search).get('id');
    let currentMonth = new Date();
    let selectedDates = [];
    let pollData = null;
    let votes = [];
    let myChoices = {};

    async function init() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        if (pollId) {
            await loadPoll();
        } else {
            renderCreateView();
        }
    }

    // --- TVORBA ANKETY ---
    function renderCreateView() {
        const container = document.getElementById('mainContent');
        container.innerHTML = `
            <header class="mb-8 text-center"><h1 class="text-3xl font-bold">Vytvořit hlasování</h1></header>
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="monthLabel" class="font-bold"></h2>
                        <div class="flex gap-1">
                            <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-left"></i></button>
                            <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-right"></i></button>
                        </div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center"></div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="font-bold mb-4 text-lg">Vybrané termíny</h2>
                    <div id="selectedList" class="space-y-4 text-sm"></div>
                    <button onclick="savePoll()" id="saveBtn" class="w-full mt-8 bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 hidden">Vytvořit unikátní odkaz</button>
                </div>
            </div>`;
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const label = document.getElementById('monthLabel');
        grid.innerHTML = '<div class="text-[10px] text-slate-400 font-bold uppercase py-2">Po</div><div class="text-[10px] text-slate-400 font-bold uppercase py-2">Út</div><div class="text-[10px] text-slate-400 font-bold uppercase py-2">St</div><div class="text-[10px] text-slate-400 font-bold uppercase py-2">Čt</div><div class="text-[10px] text-slate-400 font-bold uppercase py-2">Pá</div><div class="text-[10px] text-slate-400 font-bold uppercase py-2 text-red-400">So</div><div class="text-[10px] text-slate-400 font-bold uppercase py-2 text-red-400">Ne</div>';
        
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        label.innerText = new Intl.DateTimeFormat('cs-CZ', { month: 'long', year: 'numeric' }).format(currentMonth);

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const offset = (firstDay === 0 ? 7 : firstDay) - 1;

        for (let i = 0; i < offset; i++) grid.innerHTML += `<div></div>`;

        for (let day = 1; day <= daysInMonth; day++) {
            const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isSelected = selectedDates.some(d => d.date === dStr);
            grid.innerHTML += `<button onclick="toggleDate('${dStr}')" class="p-3 rounded-lg text-sm transition-all ${isSelected ? 'bg-blue-600 text-white font-bold' : 'hover:bg-blue-100'}">${day}</button>`;
        }
        lucide.createIcons();
    }

    function changeMonth(s) { currentMonth.setMonth(currentMonth.getMonth() + s); renderCalendar(); }

    function toggleDate(dStr) {
        const idx = selectedDates.findIndex(d => d.date === dStr);
        if (idx > -1) selectedDates.splice(idx, 1); else selectedDates.push({ date: dStr, times: [] });
        renderCalendar(); renderSelectedList();
    }

    function addTime(dStr) {
        const t = prompt("Zadejte čas nebo upřesnění (např. 18:00):", "18:00");
        if (t) { selectedDates.find(d => d.date === dStr).times.push(t); renderSelectedList(); }
    }

    function removeTime(dStr, i) {
        selectedDates.find(d => d.date === dStr).times.splice(i, 1);
        renderSelectedList();
    }

    function renderSelectedList() {
        const list = document.getElementById('selectedList');
        const btn = document.getElementById('saveBtn');
        btn.classList.toggle('hidden', selectedDates.length === 0);
        
        list.innerHTML = selectedDates.sort((a,b) => a.date.localeCompare(b.date)).map(d => `
            <div class="border-b pb-3 group">
                <div class="flex justify-between font-bold text-slate-700">
                    <span>${new Date(d.date).toLocaleDateString('cs-CZ', { weekday: 'short', day: 'numeric', month: 'numeric' })}</span>
                    <button onclick="toggleDate('${d.date}')" class="text-red-300 hover:text-red-600">×</button>
                </div>
                <div class="flex flex-wrap gap-2 mt-2">
                    ${d.times.map((t, i) => `<span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs flex items-center gap-1">${t} <button onclick="removeTime('${d.date}', ${i})" class="hover:text-red-500">×</button></span>`).join('')}
                    <button onclick="addTime('${d.date}')" class="text-xs text-blue-600 hover:underline">+ Přidat čas</button>
                </div>
            </div>`).join('');
    }

    async function savePoll() {
        let finalOptions = [];
        selectedDates.forEach(d => {
            if (d.times.length === 0) finalOptions.push(`${d.date} (Celý den)`);
            else d.times.forEach(t => finalOptions.push(`${d.date} o ${t}`));
        });
        const { data, error } = await supabaseClient.from('polls').insert([{ options: finalOptions }]).select();
        if (error) alert("Chyba při ukládání do DB.");
        else window.location.search = `?id=${data[0].id}`;
    }

    // --- HLASOVÁNÍ ---
    async function loadPoll() {
        const { data: poll } = await supabaseClient.from('polls').select('*').eq('id', pollId).single();
        const { data: vts } = await supabaseClient.from('votes').select('*').eq('poll_id', pollId);
        if (!poll) { alert("Anketa nebyla nalezena."); return; }
        pollData = poll; votes = vts;
        renderVoteView();
    }

    function renderVoteView() {
        const container = document.getElementById('mainContent');
        const opts = pollData.options;
        
        container.innerHTML = `
            <h1 class="text-2xl font-bold mb-6 text-center">Hlasování</h1>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-2 md:p-6 mb-8 overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="p-3 border-b text-left min-w-[150px]">Jméno</th>
                            ${opts.map(o => `<th class="p-2 border-b text-[10px] min-w-[60px] text-center leading-tight">${o.replace(' o ', '<br>')}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${votes.map(v => `
                            <tr class="hover:bg-slate-50">
                                <td class="p-3 border-b font-medium text-sm">${v.user_name}</td>
                                ${opts.map((_, i) => `<td class="p-1 border-b"><div class="mx-auto w-8 h-8 rounded state-${v.choices[i] || 0}"></div></td>`).join('')}
                            </tr>`).join('')}
                        <tr class="bg-blue-50">
                            <td class="p-3 border-b"><input id="myName" type="text" placeholder="Vaše jméno..." class="w-full p-2 border rounded-lg text-sm"></td>
                            ${opts.map((_, i) => `<td class="p-1 border-b text-center"><button onclick="toggleVote(${i})" id="cell-${i}" class="cell-btn state-0 mx-auto"></button></td>`).join('')}
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div id="unfilledCount" class="text-orange-600 font-bold"></div>
                <button onclick="submitVote()" class="bg-green-600 text-white px-10 py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 w-full md:w-auto">Odeslat můj hlas</button>
            </div>
            <div class="mt-8 text-center text-xs text-slate-400">Po odeslání se stránka aktualizuje a uvidíte výsledky.</div>
        `;
        updateUnfilled();
        lucide.createIcons();
    }

    function toggleVote(i) {
        myChoices[i] = ((myChoices[i] || 0) + 1) % 4;
        const btn = document.getElementById(`cell-${i}`);
        btn.className = `cell-btn state-${myChoices[i]} mx-auto`;
        updateUnfilled();
    }

    function updateUnfilled() {
        const total = pollData.options.length;
        const filled = Object.values(myChoices).filter(v => v !== 0).length;
        const left = total - filled;
        document.getElementById('unfilledCount').innerText = left > 0 ? `Zbývá vyplnit ${left} polí` : 'Vše připraveno!';
    }

    async function submitVote() {
        const name = document.getElementById('myName').value;
        if (!name) return alert("Napište prosím své jméno.");
        const { error } = await supabaseClient.from('votes').insert([{
            poll_id: pollId,
            user_name: name,
            choices: myChoices
        }]);
        if (error) alert("Chyba při odesílání.");
        else location.reload();
    }

    init();
</script>
</body>
</html>
